services:
  winauth:
    image: ${WINAUTH_IMAGE:?Set WINAUTH_IMAGE to ghcr.io/owner/repository:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      WINAUTH_HOST: 0.0.0.0
      WINAUTH_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - vault:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vault:
