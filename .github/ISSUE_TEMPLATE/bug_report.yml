name: Bug report
description: Report a reproducible bug without sharing authenticator secrets.
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a real WinAuth export, vault/key, Steam cookie, password, or recovery code.
        Use synthetic account data. For vulnerabilities, follow SECURITY.md instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include only synthetic examples and sanitized errors.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Version, browser, Python version, Docker/local, operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed all real authenticator secrets and account credentials.
          required: true
