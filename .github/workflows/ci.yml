name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies and browser
        run: |
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Lint and syntax
        run: |
          ruff check .
          ruff format --check .
          for script in winauth_reborn/static/*.js; do node --check "$script"; done
      - name: Run backend and browser tests
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose --env-file .env.example config --no-env-resolution --quiet
      - name: Build container
        run: docker build -t winauth-reborn:ci .
      - name: Verify authenticated container response
        run: |
          docker run -d --name winauth-ci -p 127.0.0.1:8080:8080 \
            -e WINAUTH_USERNAME=ci \
            -e WINAUTH_PASSWORD=synthetic-ci-only-password winauth-reborn:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail -u ci:synthetic-ci-only-password http://127.0.0.1:8080/api/accounts; then
              break
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = 401
          curl --silent --fail -u ci:synthetic-ci-only-password http://127.0.0.1:8080/api/accounts \
            | python -c 'import json,sys; assert json.load(sys.stdin)["accounts"] == []'
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs winauth-ci || true
          docker rm -f winauth-ci || true
